[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinirepgen"
version = "0.1.0"
description = "Clinical Trial Report Generator - Generate CONSORT and ICH E3 compliant reports"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "CliniRepGen Team"}
]
keywords = [
    "clinical-trials",
    "CONSORT",
    "ICH-E3",
    "report-generation",
    "NLP",
    "LLM",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "click>=8.0",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "tabulate>=0.9",
    "PyYAML>=6.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
full = [
    "transformers>=4.30",
    "tiktoken>=0.5",
]

[project.scripts]
clinirepgen = "clinirepgen.cli:main"

[project.urls]
Homepage = "https://github.com/croberts/CliniRepGen"
Documentation = "https://github.com/croberts/CliniRepGen#readme"
Repository = "https://github.com/croberts/CliniRepGen"

[tool.setuptools.packages.find]
where = ["."]
include = ["clinirepgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
