name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Verify installation
      run: |
        python -m clinirepgen.cli --version
        python -c "import clinirepgen; print(clinirepgen.__version__)"
    
    - name: Run smoke test
      run: |
        ./scripts/demo.sh
    
    - name: Check outputs
      run: |
        ls -lh demo_output/
        if [ ! -f demo_output/demo_manifest.json ]; then
          echo "ERROR: Manifest not created"
          exit 1
        fi
        echo "Manifest created successfully"
    
    - name: Validate manifest structure
      run: |
        sudo apt-get update && sudo apt-get install -y jq
        TRIAL_ID=$(jq -r '.trial_id' demo_output/demo_manifest.json)
        DOC_COUNT=$(jq '.documents | length' demo_output/demo_manifest.json)
        SEC_COUNT=$(jq '.sections | length' demo_output/demo_manifest.json)
        
        echo "Trial ID: $TRIAL_ID"
        echo "Documents: $DOC_COUNT"
        echo "Sections: $SEC_COUNT"
        
        if [ "$TRIAL_ID" != "NCT00000001" ]; then
          echo "ERROR: Invalid trial_id"
          exit 1
        fi
        
        if [ "$DOC_COUNT" -lt 1 ] || [ "$SEC_COUNT" -lt 1 ]; then
          echo "ERROR: Manifest incomplete"
          exit 1
        fi
        
        echo "Manifest structure is valid"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: demo-output-py${{ matrix.python-version }}
        path: demo_output/

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run ruff
      run: |
        python -m ruff check clinirepgen/ --output-format=github
      continue-on-error: true
    
    - name: Run mypy
      run: |
        python -m mypy clinirepgen/
      continue-on-error: true
